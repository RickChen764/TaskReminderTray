name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Verify tag matches project version
        shell: pwsh
        run: |
          [xml]$project = Get-Content .\TaskReminderTray\TaskReminderTray.csproj
          $version = $project.Project.PropertyGroup.Version
          $acceptedTags = @("v$version", "v$version.0")
          if ("${{ github.ref_name }}" -notin $acceptedTags) {
            throw "Tag ${{ github.ref_name }} does not match project version v$version"
          }

      - name: Test
        run: dotnet test .\TaskReminderTray.slnx -c Release

      - name: Publish
        run: >-
          dotnet publish .\TaskReminderTray\TaskReminderTray.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None -p:DebugSymbols=false
          -o .\publish

      - name: Prepare release assets
        shell: pwsh
        run: |
          Move-Item .\publish\TaskReminderTray.exe .\TaskReminderTray-win-x64.exe
          $hash = (Get-FileHash .\TaskReminderTray-win-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TaskReminderTray-win-x64.exe" | Set-Content -Encoding ascii -NoNewline .\TaskReminderTray-win-x64.exe.sha256

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          .\TaskReminderTray-win-x64.exe
          .\TaskReminderTray-win-x64.exe.sha256
          --title "TaskReminderTray ${{ github.ref_name }}"
          --generate-notes
